<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="alternate icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Travel Port Leisure — Explore the Unexplored</title>
    <meta
      name="description"
      content="Travel Port Leisure (Private) Limited — corporate travel, MICE and incentive tours from Colombo, Sri Lanka. Seamless, end-to-end travel management for corporate, incentive, leisure and group travel worldwide."
    />
    <meta name="theme-color" content="#0c2340" />
    <link rel="canonical" href="https://www.tpleisure.lk/" />

    <!-- Link previews on WhatsApp, LinkedIn, Facebook, X. Absolute URLs on the
         client's own domain, so shared links never show a vercel.app address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Travel Port Leisure" />
    <meta property="og:url" content="https://www.tpleisure.lk/" />
    <meta property="og:title" content="Travel Port Leisure — Explore the Unexplored" />
    <meta
      property="og:description"
      content="Corporate travel, MICE and incentive tours from Colombo, Sri Lanka. The leisure arm of Base HP."
    />
    <meta property="og:image" content="https://www.tpleisure.lk/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "Travel Port Leisure (Private) Limited",
        "url": "https://www.tpleisure.lk/",
        "logo": "https://www.tpleisure.lk/apple-touch-icon.png",
        "image": "https://www.tpleisure.lk/og-image.jpg",
        "email": "info@tpleisure.lk",
        "telephone": "+94112552452",
        "slogan": "Explore the Unexplored",
        "parentOrganization": { "@type": "Organization", "name": "Base HP" },
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "No. 181, Nawala Road, Narahenpita",
          "addressLocality": "Colombo 05",
          "addressCountry": "LK"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Karla:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
